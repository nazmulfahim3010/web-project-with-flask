{% extends "base.html" %}

{% block title %}Create Blog | MiniBlog{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">

        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">

                <!-- HEADER -->
                <div class="text-center mb-4">
                    <i class="bi bi-pencil-square fs-1 text-primary"></i>
                    <h3 class="fw-bold mt-2">Write a New Blog</h3>
                    <p class="text-muted">Share your thoughts with the world</p>
                </div>

                <!-- CREATE BLOG FORM -->
                <form method="POST">

                    <!-- BLOG TITLE -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Blog Title</label>
                        <input type="text" class="form-control form-control-lg" name="title"
                            placeholder="Enter blog title" required>
                    </div>

                    <!-- BLOG CONTENT -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Blog Content</label>
                        <textarea class="form-control" name="content" rows="10" placeholder="Write your blog here..."
                            required></textarea>
                    </div>

                    <!-- SUBMIT BUTTON -->
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary btn-lg px-4">
                            <i class="bi bi-upload me-2"></i> Publish Blog
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}

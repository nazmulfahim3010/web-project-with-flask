{% extends "base.html" %}

{% block title %}Login | MiniBlog{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">

        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">

                <!-- TITLE -->
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle fs-1 text-primary"></i>
                    <h3 class="fw-bold mt-2">Welcome Back</h3>
                    <p class="text-muted">Login to your account</p>
                </div>

                <!-- LOGIN FORM -->
                <form method="POST">

                    <!-- USERNAME -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username or Email</label>
                        <input type="text" class="form-control form-control-lg" name="login_id"
                            placeholder="Enter username or email" required>
                    </div>

                    <!-- PASSWORD -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control form-control-lg" name="password"
                            placeholder="Enter your password" required>
                    </div>

                    <!-- REMEMBER + FORGOT -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label text-muted" for="remember">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="text-decoration-none small">
                            Forgot password?
                        </a>
                    </div>

                    <!-- LOGIN BUTTON -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Login
                        </button>
                    </div>

                </form>

                <!-- SIGNUP LINK -->
                <div class="text-center mt-4">
                    <p class="text-muted mb-0">
                        Don’t have an account?
                        <a href="/signup" class="fw-semibold text-decoration-none">
                            Sign Up
                        </a>
                    </p>
                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}Edit Profile | MiniBlog{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">

        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-5">

                <h3 class="fw-bold mb-4">
                    <i class="bi bi-pencil-square me-2"></i>Edit Profile
                </h3>

                <form method="POST">

                    <div class="row g-4">

                        <div class="col-md-6">
                            <label class="fw-semibold">First Name</label>
                            <input type="text" class="form-control" name="first_name"
                                value="{{ current_user.first_name }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="fw-semibold">Last Name</label>
                            <input type="text" class="form-control" name="last_name"
                                value="{{ current_user.last_name }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="fw-semibold">Email</label>
                            <input type="email" class="form-control" name="email" value="{{ current_user.email }}"
                                required>
                        </div>

                        <div class="col-md-6">
                            <label class="fw-semibold">Contact</label>
                            <input type="text" class="form-control" name="contact"
                                value="{{ current_user.contact or '' }}">
                        </div>

                        <div class="col-12">
                            <label class="fw-semibold">Bio</label>
                            <textarea class="form-control" rows="4" name="bio">{{ current_user.bio or '' }}</textarea>
                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('views.profile') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            Save Changes
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
